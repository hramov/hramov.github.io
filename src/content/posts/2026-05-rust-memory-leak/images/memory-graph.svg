<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="JetBrains Mono, monospace">
  <rect width="640" height="300" fill="#fffdf9" stroke="#e4dace"/>
  <!-- axes -->
  <line x1="60" y1="250" x2="600" y2="250" stroke="#8a7e72" stroke-width="1.5"/>
  <line x1="60" y1="40" x2="60" y2="250" stroke="#8a7e72" stroke-width="1.5"/>
  <!-- staircase memory line -->
  <polyline fill="none" stroke="#8c2f1d" stroke-width="2.5"
    points="60,230 140,230 140,200 240,200 240,175 340,175 340,140 440,140 440,110 540,110 540,80 600,80"/>
  <!-- traffic spikes (faint) -->
  <polyline fill="none" stroke="#b8543e" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"
    points="60,245 110,245 140,210 170,245 240,245 270,185 300,245 340,245 370,150 400,245 440,245 470,120 500,245 540,245 570,90 600,245"/>
  <text x="70" y="30" fill="#4a423b" font-size="13">RSS, MB</text>
  <text x="500" y="275" fill="#4a423b" font-size="13">время →</text>
  <text x="300" y="55" fill="#8c2f1d" font-size="12">память (не падает обратно)</text>
</svg>
